version: "0.1"
runson: linux
runtime:
  - language: node
    version: "20"

env:
  PLAYGROUND_BASE_URL: "https://www.testmuai.com/selenium-playground/"
  LT_USERNAME: "${{.secrets.LT_USERNAME}}"
  LT_ACCESS_KEY: "${{.secrets.LT_ACCESS_KEY}}"
  FORM_PASSWORD: "${{.secrets.FORM_PASSWORD}}"

cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

concurrency: 2
matrix:
  project: [win-chrome, linux-firefox]

testSuites:
  - npm run test:cloud -- --project=${matrix.project}

pre:
  - npm ci

report: true
partialReports:
  frameworkName: playwright
  location: playwright-report
  type: HTML

uploadArtefacts:
  - name: Playwright-Execution
    path:
      - playwright-report/**
      - test-results/**
mergeArtifacts: true