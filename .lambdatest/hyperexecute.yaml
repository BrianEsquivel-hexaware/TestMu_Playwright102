version: "0.1"
project:
  name: "BrianEsquivel-hexaware/TestMu_Playwright102"
  id: "01M3T65WHGHAEK9MPZC2XK5GHM"

runson: win
runtime:
  - language: node
    version: "20"

env:
  PLAYGROUND_BASE_URL: "https://www.testmuai.com/selenium-playground/"
  LT_USERNAME: "${{.secrets.LT_USERNAME}}"
  LT_ACCESS_KEY: "${{.secrets.LT_ACCESS_KEY}}"
  FORM_PASSWORD: "${{.secrets.FORM_PASSWORD}}"
  RUN_CLOUD_TARGETS: "true"

cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

concurrency: 2
autosplit: true

testDiscovery:
  type: raw
  mode: remote
  command: node discover-specs.cjs

testRunnerCommand: npx playwright test "$test"

pre:
  - npm ci

report: true
partialReports:
  - frameworkName: playwright
    location: playwright-report
    type: html

uploadArtefacts:
  - name: Playwright-Execution
    path:
      - playwright-report/**
      - test-results/**
mergeArtifacts: true